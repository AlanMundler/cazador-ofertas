name: Markets (ofertas)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Plataformas (all | Rappi,UberEats,PedidosYa)'
        default: 'auto'

permissions:
  contents: write

# Un solo escritor: nunca dos corridas tocando data/ a la vez.
concurrency:
  group: markets-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Patchright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: patchright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: patchright-${{ runner.os }}-

      - name: Install xvfb
        run: |
          for i in {1..3}; do
            sudo apt-get update && sudo apt-get install -y xvfb && break
            echo "apt-get update failed (attempt $i/3), retrying in 10s..."
            sleep 10
          done

      - name: Install dependencies
        run: npm ci

      - name: Install Patchright browser
        run: npx patchright install chromium --with-deps

      # WARP (Cloudflare) cambia la salida: Rappi pasa de 403 a 200 desde CI.
      - name: Instalar y conectar Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          sudo warp-cli --accept-tos registration new || true
          sudo warp-cli --accept-tos connect || true
          sleep 8
          sudo warp-cli --accept-tos status || true
          curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp)=' || true

      - name: Recolectar ofertas y notificar
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          CITY: ${{ secrets.CITY || 'Córdoba' }}
          COUNTRY: ${{ secrets.COUNTRY || 'Argentina' }}
          LATITUDE: ${{ secrets.LATITUDE || '-31.412943' }}
          LONGITUDE: ${{ secrets.LONGITUDE || '-64.1966036' }}
          IN_PLATFORMS: ${{ inputs.platforms }}
        run: |
          mkdir -p data
          # PedidosYa queda afuera sin PROXY_URL: su Cloudflare/PX también bloquea WARP (403 verificado).
          if [ -n "$PROXY_URL" ]; then
            TARGET="${IN_PLATFORMS:-auto}"
            if [ "$TARGET" = "auto" ]; then TARGET=all; fi
            echo "Con PROXY_URL -> plataformas: $TARGET"
            xvfb-run --auto-servernum node src/run.js --send --verbose --platform="$TARGET" --max-stores=50 --py-stores=23
          else
            TARGET="${IN_PLATFORMS:-Rappi,UberEats}"
            if [ "$TARGET" = "auto" ]; then TARGET=Rappi,UberEats; fi
            echo "::warning::Sin PROXY_URL: PedidosYa queda afuera (WARP no lo destraba). Plataformas: $TARGET"
            xvfb-run --auto-servernum node src/run.js --send --verbose --platform="$TARGET" --max-stores=50
          fi

      - name: Desconectar WARP
        if: always()
        run: sudo warp-cli --accept-tos disconnect || true

      - name: Commit estado compacto
        if: always()
        run: |
          git config --global user.name "cazador-bot"
          git config --global user.email "bot@cazador-ofertas.local"
          # Sólo artefactos chicos: deals.json y runs quedan como artefacto local (evita bloat).
          git add data/seen.json data/coverage.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "markets state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin master || true
          git push || true
