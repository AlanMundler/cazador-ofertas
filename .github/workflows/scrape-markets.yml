name: Markets (ofertas)

on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Plataformas (all | Rappi,PedidosYa,UberEats)'
        default: 'auto'

permissions:
  contents: write

# Un solo escritor: nunca dos corridas tocando data/ a la vez.
concurrency:
  group: markets-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Patchright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: patchright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: patchright-${{ runner.os }}-

      - name: Install xvfb
        run: |
          for i in {1..3}; do
            sudo apt-get update && sudo apt-get install -y xvfb && break
            echo "apt-get update failed (attempt $i/3), retrying in 10s..."
            sleep 10
          done

      - name: Install dependencies
        run: npm ci

      - name: Install Patchright browser
        run: npx patchright install chromium --with-deps

      # WARP (Cloudflare) da salida válida para Rappi y PedidosYa desde GitHub Actions.
      # Uber Eats necesita egress argentino: usa UE_PROXY_URL (o corre en local).
      - name: Instalar y conectar Cloudflare WARP
        id: warp
        env:
          UE_PROXY_URL: ${{ secrets.UE_PROXY_URL }}
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          sudo systemctl enable --now warp-svc || true

          trace=""
          for attempt in 1 2 3; do
            sudo warp-cli --accept-tos registration new || true
            sudo warp-cli --accept-tos connect || true
            sleep 8
            sudo warp-cli --accept-tos status || true
            trace=$(curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -E '^warp=' || true)
            echo "intento $attempt -> ${trace:-sin-trace}"
            [ "$trace" = "warp=on" ] && break
            sudo warp-cli --accept-tos disconnect || true
            sleep 5
          done

          if [ "$trace" = "warp=on" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WARP no conectó tras 3 intentos; Rappi/PedidosYa pueden fallar."
          fi
          curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp)=' || true

      - name: Verificar proxy de Uber Eats (si existe)
        env:
          UE_PROXY_URL: ${{ secrets.UE_PROXY_URL }}
        run: |
          if [ -z "$UE_PROXY_URL" ]; then
            echo "sin UE_PROXY_URL"
            exit 0
          fi
          ip=$(curl -s -x "$UE_PROXY_URL" --max-time 20 https://api.ipify.org || true)
          code=$(curl -s -x "$UE_PROXY_URL" --max-time 20 -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' -X POST -H 'content-type: application/json' -H 'x-csrf-token: x' -d '{"feedID":"shop_feed","deliveryLocation":[{"type":"GEOIP"}],"feedmakerCtx":"","cacheKey":""}' 'https://www.ubereats.com/_p/api/getFeedByIdV1?localeCode=ar' || true)
          echo "ue_proxy_egress_ip=${ip:-sin-respuesta} ue_feed=${code:-sin-respuesta}"

      - name: Recolectar ofertas y notificar
        if: steps.warp.outputs.on == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          UE_PROXY_URL: ${{ secrets.UE_PROXY_URL }}
          PY_PROXY_URL: ${{ secrets.PY_PROXY_URL }}
          CITY: ${{ secrets.CITY || 'Córdoba' }}
          COUNTRY: ${{ secrets.COUNTRY || 'Argentina' }}
          LATITUDE: ${{ secrets.LATITUDE || '-31.412943' }}
          LONGITUDE: ${{ secrets.LONGITUDE || '-64.1966036' }}
          IN_PLATFORMS: ${{ inputs.platforms }}
        run: |
          mkdir -p data
          TARGET="${IN_PLATFORMS:-auto}"
          if [ "$TARGET" = "auto" ]; then
            TARGET=Rappi,PedidosYa,UberEats
          fi
                    echo "Plataformas: $TARGET"
          xvfb-run --auto-servernum node src/run.js --send --verbose --platform="$TARGET" --max-stores=0 --py-stores=0

      - name: Desconectar WARP
        if: always()
        run: sudo warp-cli --accept-tos disconnect || true

      - name: Commit estado compacto
        if: always()
        run: |
          git config --global user.name "cazador-bot"
          git config --global user.email "bot@cazador-ofertas.local"
          # Sólo artefactos chicos: deals.json y runs quedan como artefacto local (evita bloat).
          git add data/seen.json data/coverage.json data/health.json data/digest.json data/cache 2>/dev/null || true
          git diff --cached --quiet || git commit -m "markets state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin master || true
          git push || true






