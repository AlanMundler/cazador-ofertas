name: PedidosYa

on:
  workflow_dispatch:
  schedule:
    - cron: '0,30 * * * *'

permissions:
  contents: write

concurrency:
  group: scrape-py
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    name: PY Market + Restaurantes
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish curated offers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          CITY: ${{ secrets.CITY || 'Córdoba' }}
          COUNTRY: ${{ secrets.COUNTRY || 'Argentina' }}
          LATITUDE: ${{ secrets.LATITUDE || '-31.412943' }}
          LONGITUDE: ${{ secrets.LONGITUDE || '-64.1966036' }}
          MIN_DISCOUNT: '50'
          MIN_DISCOUNT_SUPER: '50'
          FLASH_THRESHOLD: '75'
          MAX_PRICE_CHEAP: '500'
        run: |
          mkdir -p data
          sleep $((RANDOM % 90))
          node index.js --target=pedidosya

      - name: Commit history
        if: always()
        run: |
          git config --global user.name "cazador-bot"
          git config --global user.email "bot@cazador-ofertas.local"
          git add data/ || true
          git diff --cached --quiet || git commit -m "update history $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git pull --rebase origin master || true
            git push && break
            sleep $((RANDOM % 20 + 5))
          done || true
