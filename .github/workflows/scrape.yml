name: Cazador de Ofertas

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Buscar ofertas
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Patchright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: patchright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: patchright-${{ runner.os }}-

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install dependencies
        run: npm ci

      - name: Install Patchright browser
        run: npx patchright install chromium --with-deps

      - name: Run offer hunter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          CITY: ${{ secrets.CITY || 'Córdoba' }}
          COUNTRY: ${{ secrets.COUNTRY || 'Argentina' }}
          LATITUDE: ${{ secrets.LATITUDE || '-31.4201' }}
          LONGITUDE: ${{ secrets.LONGITUDE || '-64.1888' }}
          MIN_DISCOUNT: '60'
          MIN_DISCOUNT_SUPER: '51'
          FLASH_THRESHOLD: '75'
          MAX_PRICE_CHEAP: '500'
        run: xvfb-run --auto-servernum node index.js

      - name: Commit history data
        if: always()
        run: |
          git config --global user.name "cazador-bot"
          git config --global user.email "bot@cazador-ofertas.local"
          git add data/ || true
          git diff --cached --quiet || git commit -m "update history $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin master || true
          git push || true
